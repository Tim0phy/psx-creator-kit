<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>PSX Character Creator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=block" rel="stylesheet" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="frame">
    <div id="stage">
      <canvas id="view" width="480" height="360"></canvas>
    </div>

    <div id="leftColumn"></div>
    <aside id="panel">
      <div id="panelHead"><span id="panelTitle">EYES</span></div>
      <div id="panelBody"></div>
    </aside>

    <div id="topRight">
      <button class="topBtn btnPink" id="btnRotate">AUTO ROTATION</button>
      <button class="topBtn btnPurple" id="btnRandom">RANDOM</button>
      <button class="topBtn btnOrange" id="btnReset">RESET</button>
    </div>

    <nav id="categoryBar">
      <button class="catBtn catFace" data-cat="face" aria-label="Face"></button>
      <button class="catBtn catHead" data-cat="head" aria-label="Head"></button>
      <button class="catBtn catTop" data-cat="top" aria-label="Top"></button>
      <button class="catBtn catBottom" data-cat="bottom" aria-label="Bottom"></button>
      <button class="catBtn catShoes" data-cat="shoes" aria-label="Shoes"></button>
      <button class="catBtn catAcc" data-cat="accessories" aria-label="Accessories"></button>
    </nav>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
