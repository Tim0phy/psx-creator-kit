<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>PSX Character Creator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=block" rel="stylesheet" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="frame">
    <div id="stage">
      <canvas id="view" width="480" height="360"></canvas>
    </div>

    <div id="topBar">
      <div id="nameBox">
        <input id="nameInput" maxlength="12" placeholder="NAME" autocomplete="off" />
        <span id="namePencil" class="pixIcon"></span>
      </div>
      <button id="btnDice" class="topIconBtn" title="Random name"></button>
      <button id="btnRandom" class="pixBtn pixShuffle" title="Random"></button>
      <button id="btnReset" class="pixBtn pixReset" title="Reset"></button>
    </div>

    <button id="btnRotate" class="pixBtn pixRotate" title="Auto rotation"></button>

    <div id="sheet">
      <aside id="leftPanel">
        <div id="leftPill">
          <span class="pillStar"></span><span id="leftPillText">HAIR STYLE</span><span class="pillStar"></span>
        </div>
        <div id="leftGrid"></div>
        <div id="gridDots"></div>
      </aside>

      <aside id="rightPanel">
        <div id="rightBody"></div>
      </aside>

      <div id="centreCol">
        <button id="btnConfirm">CONFIRM</button>
        <div id="toast">SAVED</div>
      </div>
    </div>

    <nav id="categoryBar">
      <button class="catBtn catFace" data-cat="face" aria-label="Face"></button>
      <button class="catBtn catHead" data-cat="head" aria-label="Head"></button>
      <button class="catBtn catTop" data-cat="top" aria-label="Top"></button>
      <button class="catBtn catBottom" data-cat="bottom" aria-label="Bottom"></button>
      <button class="catBtn catShoes" data-cat="shoes" aria-label="Shoes"></button>
      <button class="catBtn catAcc" data-cat="accessories" aria-label="Accessories"></button>
      <button class="catBtn catStyle" data-cat="style" aria-label="Style"></button>
    </nav>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
